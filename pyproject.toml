[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decoder-siem"
version = "0.1.0"
description = "Estrae IOC da JSON incidenti SIEM (Cynet) e li arricchisce via VirusTotal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "vt-py>=0.18",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["gradio>=4.0"]

[project.scripts]
decoder-siem = "decoder_siem.cli:app"
decoder-siem-gui = "decoder_siem.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["decoder_siem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
